<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Site bloqué</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{color-scheme:light dark}
  body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:-apple-system,BlinkMacSystemFont,sans-serif;
       background:linear-gradient(135deg,#1f3a35,#2d4a6b);color:#fff}
  .card{text-align:center;padding:48px 56px;border-radius:24px;background:rgba(255,255,255,.08);
        backdrop-filter:blur(20px);max-width:460px}
  .icon{font-size:56px}
  h1{margin:12px 0 8px;font-weight:600}
  p{opacity:.75;line-height:1.5}
  b{opacity:1}
</style></head>
<body><div class="card">
  <div class="icon">🛡️</div>
  <h1>Site bloqué</h1>
  <p><b id="d"></b> est bloqué par Rempart.<br>
  Ouvre Rempart si tu as une vraie raison de le débloquer.</p>
</div>
<script>document.getElementById('d').textContent=decodeURIComponent(location.hash.slice(1))||'Ce site';</script>
</body></html>
