<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Site bloqué</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:ui-rounded,"SF Pro Rounded",-apple-system,sans-serif;background:#121214;color:#fff;overflow:hidden}
  .wrap{text-align:center}
  svg{width:200px;height:200px;filter:drop-shadow(0 0 40px rgba(230,26,102,.45));animation:f 3s ease-in-out infinite alternate}
  @keyframes f{from{transform:translateY(-8px)}to{transform:translateY(8px)}}
  @media (prefers-reduced-motion:reduce){svg{animation:none}}
  h1{margin:24px 0 8px;font-size:34px}
  p{color:#8c8c93;line-height:1.5;font-size:17px}
  b{color:#fff}
</style></head>
<body><div class="wrap">
  <svg viewBox="-100 -100 200 200" aria-hidden="true">
    <defs><radialGradient id="g"><stop offset="0" stop-color="#e61a66"/><stop offset="1" stop-color="#f77399"/></radialGradient></defs>
    <path id="b" fill="url(#g)"/>
    <circle cx="-24" cy="-6" r="6" fill="#4d041f"/><circle cx="24" cy="-6" r="6" fill="#4d041f"/>
    <path d="M-40-30L-14-18M40-30L14-18" stroke="#4d041f" stroke-width="5" stroke-linecap="round"/>
    <path d="M-12 30Q0 20 12 30" stroke="#4d041f" stroke-width="5" fill="none" stroke-linecap="round"/>
  </svg>
  <h1>Site bloqué</h1>
  <p><b id="d"></b> est bloqué : c'est un choix que tu as fait.<br>Si c'est vraiment important, ouvre Rempart et demande à un proche.</p>
</div>
<script>
  document.getElementById('d').textContent=decodeURIComponent(location.hash.slice(1))||'Ce site';
  let d='';for(let i=0;i<=240;i++){const t=i/240*2*Math.PI,r=100*(0.95+0.05*Math.cos(8*t));
    d+=(i?'L':'M')+(r*Math.cos(t)).toFixed(1)+' '+(r*Math.sin(t)).toFixed(1)}
  document.getElementById('b').setAttribute('d',d+'Z');
</script>
</body></html>
